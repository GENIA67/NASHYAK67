<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НАШЯК · Вхід ведучої</title><style>body{margin:0;background:#0b1226;color:#f7f8fc;font:16px system-ui;min-height:100vh;display:grid;place-items:center}.panel{background:#172b52;border:1px solid #40577f;border-radius:20px;padding:28px;width:min(420px,calc(100vw - 50px));text-align:center}h1{color:#f4c44e}button{border:0;border-radius:12px;background:#f4c44e;color:#101a35;font-weight:800;padding:15px 20px;font-size:17px;cursor:pointer}code{display:block;overflow-wrap:anywhere;background:#0b1226;padding:14px;border-radius:10px;margin:15px 0}p{line-height:1.5;color:#b6c5e0}#identity{display:none}</style></head><body><main class="panel"><h1>НАШЯК</h1><h2>Вхід ведучої</h2><p>Увійди через той Google-акаунт, яким керуватимеш грою.</p><button id="login">Увійти через Google</button><div id="identity"><p>Вхід успішний! Ідентифікатор ведучої (UID):</p><code id="uid"></code><button id="copy">Скопіювати UID</button><p>Це ідентифікатор користувача, не пароль. Надішли його в чат для налаштування прав.</p></div><p id="status"></p></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";const app=initializeApp({apiKey:"AIzaSyDl5jB8zlBsGAPJ029KWNL6mis9VFCM9zY",authDomain:"nashyak-207a0.firebaseapp.com",databaseURL:"https://nashyak-207a0-default-rtdb.europe-west1.firebasedatabase.app",projectId:"nashyak-207a0",appId:"1:298642237818:web:f4b14eafbe81af60548ec3"});const auth=getAuth(app);const $=s=>document.querySelector(s);onAuthStateChanged(auth,u=>{if(u){$("#identity").style.display="block";$("#uid").textContent=u.uid;$("#login").style.display="none";$("#status").textContent="";}});$("#login").onclick=async()=>{try{$("#status").textContent="Відкриваємо Google…";await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("#status").textContent="Не вдалося увійти: "+e.code+" — "+e.message}};$("#copy").onclick=async()=>{try{await navigator.clipboard.writeText($("#uid").textContent);$("#status").textContent="UID скопійовано"}catch{$("#status").textContent="Виділи UID та скопіюй вручну"}};</script></body></html>
