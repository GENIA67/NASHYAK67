<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СВОЯК · Кнопка гравця</title><style>*{box-sizing:border-box}body{margin:0;background:#071329;color:white;font-family:system-ui,Arial,sans-serif;min-height:100dvh}.wrap{max-width:440px;margin:auto;padding:22px 18px;text-align:center}.brand{font-weight:900;font-size:28px;letter-spacing:3px;color:#f4c44e}.hint{color:#b2c5e8;font-size:14px;margin:12px 0 22px}select{width:100%;background:#14254a;color:white;border:1px solid #4662a0;border-radius:12px;padding:15px;font-size:18px}.scorecard{background:#101f43;border:1px solid #35548e;border-radius:22px;margin:24px 0;padding:22px}.name{font-size:20px;font-weight:750}.score{font-size:clamp(55px,14vw,80px);font-weight:900;margin:8px 0;color:#fff}.label{color:#a9bfec}.buzzer{width:min(70vw,265px);aspect-ratio:1;border:10px solid #8b1526;border-radius:50%;background:radial-gradient(circle at 40% 25%,#ff6b72,#d11e38 60%,#9e1028);box-shadow:0 14px 0 #6d1224,0 22px 32px #0009;color:#fff;font-size:35px;font-weight:950;touch-action:manipulation;cursor:pointer}.buzzer:not(:disabled){background:radial-gradient(circle at 38% 24%,#ff777d 0%,#f02842 45%,#bd0927 100%);border-color:#ff425b;box-shadow:0 12px 0 #760b23,0 18px 34px #0009,0 0 24px #f0264666;color:#fff}.buzzer:not(:disabled):active{transform:translateY(7px);box-shadow:0 5px 0 #760b23,0 9px 18px #0008}.buzzer:disabled{background:#4a5871;border-color:#354057;box-shadow:none;color:#bdc6d7;cursor:default}.status{min-height:64px;margin:32px 0 10px;font-weight:750;font-size:18px}.foot{color:#8ca1c5;font-size:13px;line-height:1.5} .choicegrid{display:grid;gap:10px}.choice{width:100%;padding:15px;border-radius:12px;background:#1a3970;border:1px solid #5d83c3;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.choice:disabled{opacity:.4;cursor:default}.choice.secondary{background:#17233c;margin-top:10px}.confirmbox{background:#14254a;border:1px solid @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap");
body{font-family:"Manrope",system-ui,sans-serif;background:radial-gradient(ellipse at 92% 20%,#352076 0%,transparent 46%),radial-gradient(ellipse at 4% 88%,#202b82 0%,transparent 48%),#080d25}.brand{font-family:"Unbounded",sans-serif;font-weight:800;letter-spacing:1px;color:#fff;text-shadow:0 0 20px #a16af466}.hint,.label{color:#c5c7eb}select,.confirmbox{background:#161a44;border-color:#6752aa;color:#fff}.scorecard{background:linear-gradient(145deg,#1c1e4b,#111838);border-color:#6253a7;box-shadow:0 0 22px #875cf126}.name{color:#fff}.score{color:#fff}.choice{background:linear-gradient(135deg,#6144c8,#332f7d);border-color:#9473ed;color:#fff}.choice.secondary{background:#1a2047}.status{color:#f4efff}.foot{color:#a7add7}#onlineResults{background:#161a43;border-color:#9a72e8}#resultList .resultRow{background:#242354}.resultRow.mine{border-color:#b58aff}.resultRow.top{color:#d9b5ff}#onlineExit{background:linear-gradient(135deg,#a16bf2,#6d4cdb);color:#fff}.buzzer:not(:disabled){background:radial-gradient(circle at 38% 24%,#ff8187,#f02c48 45%,#bb0929);border-color:#ff5269;box-shadow:0 12px 0 #750c24,0 18px 34px #0009,0 0 28px #f12c5070;color:#fff}.buzzer:disabled{background:#363957;border-color:#292f50;box-shadow:none;color:#b8bad2}
/* Reference artwork refinement: active buzzer remains red by request */
body{isolation:isolate}body::before,body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:88vw;height:35vh;border-radius:48% 52% 0 0 / 90% 100% 0 0;filter:drop-shadow(0 0 26px #7748f355)}body::before{left:-24vw;bottom:-13vh;transform:rotate(13deg);background:linear-gradient(125deg,#193c9e 3%,#6533cb 54%,#a347ed 85%,transparent 100%);opacity:.68}body::after{right:-30vw;bottom:-16vh;transform:rotate(-16deg);background:linear-gradient(110deg,transparent,#173db4 35%,#7940d8 76%,#a948ec);opacity:.68}
body{background:radial-gradient(ellipse at 86% 14%,#2c1b72 0%,transparent 43%),radial-gradient(ellipse at 8% 85%,#182b83 0%,transparent 50%),#080c25}body::before{width:130vw;height:20vh;bottom:2vh;left:-60vw;transform:rotate(14deg)}body::after{width:120vw;height:18vh;bottom:-7vh;right:-65vw;transform:rotate(-13deg)}.wrap{position:relative;z-index:1}.brand{font-style:italic;letter-spacing:-.06em;transform:skew(-5deg);text-shadow:0 3px 0 #3b287b,0 0 20px #a666ff55}.scorecard{background:linear-gradient(150deg,#191d4be9,#111735ef);border-color:#4e438f;box-shadow:inset 0 0 20px #704bd515,0 0 20px #704bd51a}.score{font-family:"Unbounded",sans-serif;font-weight:700;text-shadow:0 0 16px #9a76ef33}.buzzer:not(:disabled){background:radial-gradient(circle at 35% 20%,#ff7d86,#f12946 50%,#b90729);border-color:#ff4e65;box-shadow:0 12px 0 #730b24,0 18px 32px #0009,0 0 27px #f22a5373}.buzzer:disabled{background:linear-gradient(145deg,#343958,#24294b);border-color:#34395d;color:#bdc3dd;box-shadow:0 0 0 2px #51498b50}.status{color:#f5f0ff;text-shadow:0 0 12px #8661c333}.choice{box-shadow:0 0 16px #704bd52c}

/* TV SHOW V2: focused mobile game interface */
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:stretch;padding:26px 20px}.brand{font-family:"Unbounded",sans-serif;font-style:italic;letter-spacing:-.065em;color:#fff}.scorecard{margin:14px 0 24px;background:linear-gradient(155deg,#1a1e4a,#101637);border-color:#57499c}.score{font-family:"Unbounded",sans-serif;font-weight:700;font-size:clamp(46px,12vw,68px)}.buzzer{align-self:center;width:min(73vw,280px);font-family:"Unbounded",sans-serif;font-size:clamp(23px,6vw,31px);font-weight:800}.buzzer:not(:disabled){background:radial-gradient(circle at 36% 22%,#ff8188,#ed2947 52%,#b4082a);border-color:#ff536b;box-shadow:0 12px 0 #780b24,0 20px 32px #0009,0 0 29px #ef34557d}.buzzer:disabled{background:linear-gradient(155deg,#353957,#1a2146);border-color:#3e3b77;color:#b5b7d3}.status{font-size:17px;font-weight:800;min-height:54px;margin:26px 0 10px}.foot{margin-top:auto;font-size:12px}@media(min-height:760px){.buzzer{margin-top:5vh}}

/* СВОЯК — reference-matched flat heavy logo */
.brand{font-family:"Russo One","Arial Black",Impact,sans-serif!important;font-style:normal!important;font-weight:900!important;font-stretch:normal!important;letter-spacing:-.065em!important;transform:none!important;text-transform:uppercase!important;color:#fff!important;text-shadow:0 2px 0 #070817,0 0 12px #ffffff18!important;filter:none!important}.brand::after{content:none!important;display:none!important}.brand span,.brand b{color:#fff!important}header .brand{font-style:normal!important;transform:none!important}header .brand::after{content:none!important;display:none!important}

/* AA Duke Fill: user-provided licensed font */
@font-face{font-family:"AA Duke Fill";src:url("./fonts/AA-Duke-UA%20(1).woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
body,button,input,textarea,select,h1,h2,h3,.tag,.hint,.status,.label,.name,.score,.scorecard,.player,.category,.tile,#qtext,#category,#answer,#notice,.quiz-table th,.quiz-table td,.choice,.tab,.pill,.field label{font-family:"AA Duke Fill","Oswald","Arial Narrow",sans-serif!important}
.brand,header .brand{font-family:"Russo One","Arial Black",Impact,sans-serif!important}

/* СВОЯК — supplied wordmark and show-like purple interface */
.brand{display:flex!important;align-items:center!important;gap:14px!important;transform:none!important;filter:none!important;text-shadow:none!important;letter-spacing:normal!important}
.brand img{display:block;width:clamp(100px,11vw,190px);height:auto;aspect-ratio:1827/320;object-fit:contain;flex-shrink:0}

body{background-color:#120a32!important;background-image:radial-gradient(ellipse at 10% 0%,#5b179c60,transparent 48%),radial-gradient(ellipse at 95% 70%,#5923ae55,transparent 55%),linear-gradient(135deg,#120824,#211052 60%,#110a30)!important}

/* Mobile player legibility pass */
body{font-size:clamp(23px,5.5vw,29px)!important;line-height:1.3}

.name{font-size:clamp(31px,7vw,42px)!important}

</style></head><body><div class="wrap"><div class="brand"><img src="./assets/svoyak-logo.svg" alt="СВОЯК"></div><p class="hint">Тестовий екран гравця</p><section id="onlineChoose" hidden><p class="hint">Обери свого гравця</p><div id="onlineChoices" class="choicegrid"></div><div id="onlineConfirm" hidden class="confirmbox"><p id="onlineConfirmName"></p><button id="onlineYes" class="choice">Підтвердити вибір</button><button id="onlineNo" class="choice secondary">Назад</button></div></section><select id="player" aria-label="Оберіть гравця"></select><div class="scorecard"><div class="name" id="name">Гравець</div><div class="score" id="score">0</div><div class="label">Мої бали</div></div><button class="buzzer" id="buzz" disabled>ТИСНИ!</button><section id="onlineResults" hidden><h2 id="resultTitle">🏆 Підсумки гри</h2><p id="resultMine"></p><div id="resultList"></div><p id="resultSession"></p><button id="onlineExit" hidden>Вийти з гри</button></section><div class="status" id="status">Очікування запитання</div><p class="foot">Демонстраційний режим. Працює з панеллю ведучої лише в тому самому браузері та профілі. З інших телефонів поки не синхронізується.</p></div><script>
const STATE="nashyak-preview-audience-v1",BUZZ="nashyak-preview-demo-buzz-v1",SELECT="nashyak-preview-demo-player-v1";
const $=s=>document.querySelector(s);let data=null,pressedFor="";
function get(){try{return JSON.parse(localStorage.getItem(STATE))}catch{return null}}
function render(){data=get();const players=data?.players||[];const selected=$("#player").value||localStorage.getItem(SELECT)||"0";$("#player").innerHTML=players.map((p,i)=>'<option value="'+i+'">'+escapeHtml(p.name)+'</option>').join("");const idx=Math.min(Math.max(0,Number(selected)||0),Math.max(0,players.length-1));$("#player").value=String(idx);const p=players[idx];$("#name").textContent=p?.name||"Немає гравців";$("#score").textContent=(p?.score??0).toLocaleString("uk-UA");const active=data?.stage==="question"&&!data?.question?.modifier&&!data?.question?.shown;const key=active?(data.round+"|"+data.question.category+"|"+data.question.points+"|"+data.question.text):"";if(key!==pressedFor)pressedFor="";const event=readBuzz();const taken=event?.key===key;$("#buzz").disabled=!active||!!pressedFor||taken;$("#status").textContent=!players.length?"Відкрий панель ведучої":!active?"Очікування запитання":pressedFor?"Ти натиснула кнопку!":taken?"Першим натиснув інший гравець":"Можна натискати!";if(taken&&event.player===idx)$("#status").textContent="Ти натиснула першою!";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function readBuzz(){try{return JSON.parse(localStorage.getItem(BUZZ))}catch{return null}}
$("#player").onchange=()=>{localStorage.setItem(SELECT,$("#player").value);pressedFor="";render()};
$("#buzz").onclick=()=>{if($("#buzz").disabled||!data)return;const key=data.round+"|"+data.question.category+"|"+data.question.points+"|"+data.question.text;pressedFor=key;if(!readBuzz()||readBuzz().key!==key)localStorage.setItem(BUZZ,JSON.stringify({key,player:Number($("#player").value),name:data.players[Number($("#player").value)]?.name,time:Date.now()}));render()};
window.addEventListener("storage",e=>{if(e.key===STATE||e.key===BUZZ)render()});render();</script><script type="module" src="./online-player.js?v=20261102-3"></script></body></html>
