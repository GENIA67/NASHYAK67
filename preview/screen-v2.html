</style></head><body>
<header><div class="brand"><img src="./assets/svoyak-logo.svg" alt="СВОЯК"> <span id="round"></span></div><button id="fullscreen">На весь екран ⛶</button></header>
<main><div id="scores"></div><div id="board"></div><div id="finalTopicsScreen" style="display:none"></div><div id="question"><div id="category"></div><div id="qtext"></div><div id="media"></div><div id="responding"></div><div id="answer"></div></div><div id="notice"></div><section id="awards"><div class="award-sub">СВОЯК · РЕЗУЛЬТАТИ ГРИ</div><h1>🏆 ПІДСУМКИ</h1><div id="awardList"></div><div id="awardGreeting"></div><div id="awardConfetti"></div></section></main>
<div id="showIntro" aria-live="polite"><img id="showLogo" src="./assets/svoyak-logo.svg" alt="СВОЯК"><div id="showRound" class="showRound" hidden></div><div id="showSubtitle" class="showSubtitle"></div><div id="showNames" class="showNames"></div></div>
<script>
const SHOW_KEY="nashyak-preview-show-stage-v1";
function renderShow(data){let show;try{show=JSON.parse(localStorage.getItem(SHOW_KEY)||"null")}catch{}const stage=show?.stage;const visible=stage==="lobby"||stage==="round_intro";$("#showIntro").classList.toggle("visible",visible);if(!visible)return;$("#showLogo").hidden=stage==="round_intro";$("#showRound").hidden=stage!=="round_intro";$("#showRound").textContent=show?.round||"Раунд 1";$("#showSubtitle").textContent=stage==="lobby"?"ОЧІКУЄМО НА ГРАВЦІВ":"ПРИГОТУЙТЕСЬ ДО ГРИ";const ready=show?.ready||[];$("#showNames").textContent=stage==="lobby"?(ready.length?"Приєдналися ("+ready.length+" із "+(show.total||ready.length)+"): "+ready.join(" · "):"Очікуємо підключення гравців…"):"";}
const KEY="nashyak-preview-audience-v1", $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function mediaHTML(url){if(!url)return "";if(/^data:image\/(png|jpeg|webp|gif);base64,/i.test(url))return '<img class="media" src="'+url+'" alt="Фото до запитання">';if(!/^https?:\/\//i.test(url))return "";const safe=esc(url);if(/\.(png|jpe?g|gif|webp)(\?|$)/i.test(url))return '<img class="media" src="'+safe+'">';if(/\.(mp4|webm)(\?|$)/i.test(url))return '<video class="media" autoplay controls src="'+safe+'"></video>';if(/\.(mp3|wav|ogg)(\?|$)/i.test(url))return '<audio controls src="'+safe+'"></audio>';return '<a href="'+safe+'" target="_blank" rel="noopener" style="color:#f4c44e">Відкрити матеріал</a>'}
let lastAwardsId=null;
function renderAwards(data){
 const players=(data.players||[]).filter(p=>p.index!==0).slice().sort((a,b)=>Number(b.score)-Number(a.score));
 if(!players.length)return;
 const id=data.awardsId||"default";if(lastAwardsId===id)return;lastAwardsId=id;
 const top=Number(players[0].score)||0,winners=players.filter(p=>Number(p.score)===top);
 const ordered=players.slice().reverse(),delayStep=Math.min(1.15,5/Math.max(1,ordered.length)),base=.7;
 $("#awardList").innerHTML=ordered.map((p,i)=>'<div class="award-entry '+(Number(p.score)===top?'winner':'')+'" style="--delay:'+(base+i*delayStep)+'s"><span><span class="rank">'+(1+players.filter(x=>Number(x.score)>Number(p.score)).length)+'.</span>'+esc(p.name)+'</span><b>'+Number(p.score).toLocaleString("uk-UA")+'</b></div>').join("");
 const finish=base+ordered.length*delayStep+.4;
 $("#awardGreeting").style.setProperty("--winner-delay",finish+"s");
 $("#awardGreeting").innerHTML=(winners.length===1?"🎉 ВІТАЄМО ПЕРЕМОЖЦЯ!":"🎉 ВІТАЄМО ПЕРЕМОЖЦІВ!")+"<small>"+winners.map(p=>esc(p.name)).join(" · ")+"</small>";
 const colors=["#f4c44e","#ffffff","#71b9ff","#ff759f","#85edc3"];
 $("#awardConfetti").innerHTML=Array.from({length:65},(_,i)=>'<i class="confetti" style="--x:'+((i*73.7)%100)+'%;--c:'+colors[i%colors.length]+';--d:'+(finish+(i%12)*.11)+'s"></i>').join("");
}
function render(){let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}renderShow(data);if(!data){$("#notice").textContent="Відкрий гру в панелі ведучої, щоб розпочати.";return}
$("#round").textContent="· "+(data.round||"");
 if(data.stage==="awards"){$("#scores").style.display="none";$("#board").style.display="none";$("#question").style.display="none";$("#finalTopicsScreen").style.display="none";$("#notice").style.display="none";$("#awards").style.display="block";renderAwards(data);return;}
 lastAwardsId=null;$("#awards").style.display="none";$("#scores").style.display="flex";$("#notice").style.display="block";
$("#scores").innerHTML=(data.players||[]).filter((p,i)=>i!==0).map(p=>'<div class="player">'+esc(p.name)+'<b>'+Number(p.score||0)+'</b></div>').join("");
const q=data.question;
if(data.stage==="final"){
 $("#scores").style.display="none";
 $("#board").style.display="none";$("#notice").textContent="";
 if(data.finalStage==="topics"||data.finalStage==="setup"){
 $("#question").style.display="none";$("#finalTopicsScreen").style.display="grid";
 $("#finalTopicsScreen").innerHTML=(data.topics||[]).map(t=>'<div class="final-topic">'+esc(t)+'</div>').join("");
 }else{
 $("#finalTopicsScreen").style.display="none";$("#question").style.display="flex";
 $("#category").textContent=q?.category||"ФІНАЛ";$("#qtext").textContent=q?.text||"";
 $("#qtext").style.display=data.finalStage==="answer"?"none":"block";
 $("#media").innerHTML=data.finalStage==="answer"?"":mediaHTML(q?.media||"");
 $("#answer").innerHTML='<div style="font-size:clamp(22px,3vw,42px);margin-bottom:16px">Відповідь:</div>'+(q?.answer?'<div>'+esc(q.answer)+'</div>':'')+(q?.answerImage?'<img src="'+q.answerImage+'" alt="Фото правильної відповіді" style="display:block;max-width:85vw;max-height:55vh;object-fit:contain;margin:16px auto 0;border-radius:14px">':'');
 $("#answer").style.display=data.finalStage==="answer"?"block":"none";$("#responding").textContent="";
 }return;
}
$("#finalTopicsScreen").style.display="none";
if(data.stage==="question"&&q){
 $("#board").style.display="none";$("#question").style.display="flex";$("#notice").textContent="";
 $("#category").textContent=q.secret?"ПИТАННЯ З СЕКРЕТОМ":q.modifier?"МОДИФІКАТОР":q.category+" · "+q.points+" балів";
 $("#qtext").textContent=q.secret&&!q.secretOpened?"ПИТАННЯ З СЕКРЕТОМ · Віддайте це питання іншому гравцю":q.modifier&&!q.modifierRevealed?"МОДИФІКАТОР":q.text;
 $("#answer").innerHTML='<div style="font-size:clamp(22px,3vw,42px);font-weight:900;margin-bottom:16px">Відповідь:</div>'+(q.answer?'<div>'+esc(q.answer)+'</div>':'')+(q.answerImage&&/^data:image\/(png|jpeg|webp|gif);base64,/i.test(q.answerImage)?'<img src="'+q.answerImage+'" alt="Фото правильної відповіді" style="display:block;max-width:85vw;max-height:55vh;object-fit:contain;margin:16px auto 0;border-radius:14px">':'');
 $("#answer").style.display=(q.secret||!q.modifier)&&q.shown?"block":"none";$("#qtext").style.display=q.modifier||!q.shown?"block":"none";
 $("#media").innerHTML=q.modifier||q.shown||(q.secret&&!q.secretOpened)?"":mediaHTML(q.media);
 $("#responding").textContent=q.secret?(q.secretOpened?"Відповідає: "+(q.secretRecipient||"обраний гравець"):"Очікуємо вибору отримувача"):q.modifier?(data.responding?"Модифікатор отримує: "+data.responding:"Перший натисне — забирає модифікатор"):q.shown?"":data.responding?"Відповідає: "+data.responding:"";
 }else{
 $("#board").style.display="block";$("#question").style.display="none";$("#notice").textContent="";
 const cats=data.categories||[];
 const count=Math.max(1,...cats.map(c=>(c.tiles||[]).length));
 $("#board").innerHTML='<table class="quiz-table"><colgroup><col style="width:40%">'+Array.from({length:count},()=>'<col style="width:'+60/count+'%">').join('')+'</colgroup><tbody>'+
 cats.map(c=>'<tr><th scope="row">'+esc(c.name)+'</th>'+Array.from({length:count},(_,i)=>{const t=(c.tiles||[])[i];return '<td class="'+(t?.used?'used':'')+'">'+(t?(t.used?'':esc(t.value)):'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table>';
 }}
window.addEventListener("storage",e=>{if(e.key===KEY||e.key===SHOW_KEY)render()});
$("#fullscreen").onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
render();
</script></body></html>
