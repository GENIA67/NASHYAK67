<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>НАШЯК · Кнопка гравця</title><style>*{box-sizing:border-box}body{margin:0;background:#071329;color:white;font-family:system-ui,Arial,sans-serif;min-height:100dvh}.wrap{max-width:440px;margin:auto;padding:22px 18px;text-align:center}.brand{font-weight:900;font-size:28px;letter-spacing:3px;color:#f4c44e}.hint{color:#b2c5e8;font-size:14px;margin:12px 0 22px}select{width:100%;background:#14254a;color:white;border:1px solid #4662a0;border-radius:12px;padding:15px;font-size:18px}.scorecard{background:#101f43;border:1px solid #35548e;border-radius:22px;margin:24px 0;padding:22px}.name{font-size:20px;font-weight:750}.score{font-size:clamp(55px,14vw,80px);font-weight:900;margin:8px 0;color:#fff}.label{color:#a9bfec}.buzzer{width:min(70vw,265px);aspect-ratio:1;border:10px solid #8b1526;border-radius:50%;background:radial-gradient(circle at 40% 25%,#ff6b72,#d11e38 60%,#9e1028);box-shadow:0 14px 0 #6d1224,0 22px 32px #0009;color:#fff;font-size:35px;font-weight:950;touch-action:manipulation;cursor:pointer}.buzzer:disabled{background:#4a5871;border-color:#354057;box-shadow:none;color:#bdc6d7;cursor:default}.status{min-height:64px;margin:32px 0 10px;font-weight:750;font-size:18px}.foot{color:#8ca1c5;font-size:13px;line-height:1.5} .choicegrid{display:grid;gap:10px}.choice{width:100%;padding:15px;border-radius:12px;background:#1a3970;border:1px solid #5d83c3;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.choice:disabled{opacity:.4;cursor:default}.choice.secondary{background:#17233c;margin-top:10px}.confirmbox{background:#14254a;border:1px solid #4662a0;border-radius:14px;padding:16px;margin-top:12px}#onlineChoose[hidden],#onlineConfirm[hidden]{display:none}</style></head><body><div class="wrap"><div class="brand">НАШЯК</div><p class="hint">Тестовий екран гравця</p><section id="onlineChoose" hidden><p class="hint">Обери свого гравця</p><div id="onlineChoices" class="choicegrid"></div><div id="onlineConfirm" hidden class="confirmbox"><p id="onlineConfirmName"></p><button id="onlineYes" class="choice">Підтвердити вибір</button><button id="onlineNo" class="choice secondary">Назад</button></div></section><select id="player" aria-label="Оберіть гравця"></select><div class="scorecard"><div class="name" id="name">Гравець</div><div class="score" id="score">0</div><div class="label">Мої бали</div></div><button class="buzzer" id="buzz" disabled>ТИСНИ!</button><div class="status" id="status">Очікування запитання</div><p class="foot">Демонстраційний режим. Працює з панеллю ведучої лише в тому самому браузері та профілі. З інших телефонів поки не синхронізується.</p></div><script>
const STATE="nashyak-preview-audience-v1",BUZZ="nashyak-preview-demo-buzz-v1",SELECT="nashyak-preview-demo-player-v1";
const $=s=>document.querySelector(s);let data=null,pressedFor="";
function get(){try{return JSON.parse(localStorage.getItem(STATE))}catch{return null}}
function render(){data=get();const players=data?.players||[];const selected=$("#player").value||localStorage.getItem(SELECT)||"0";$("#player").innerHTML=players.map((p,i)=>'<option value="'+i+'">'+escapeHtml(p.name)+'</option>').join("");const idx=Math.min(Math.max(0,Number(selected)||0),Math.max(0,players.length-1));$("#player").value=String(idx);const p=players[idx];$("#name").textContent=p?.name||"Немає гравців";$("#score").textContent=(p?.score??0).toLocaleString("uk-UA");const active=data?.stage==="question"&&!data?.question?.modifier&&!data?.question?.shown;const key=active?(data.round+"|"+data.question.category+"|"+data.question.points+"|"+data.question.text):"";if(key!==pressedFor)pressedFor="";const event=readBuzz();const taken=event?.key===key;$("#buzz").disabled=!active||!!pressedFor||taken;$("#status").textContent=!players.length?"Відкрий панель ведучої":!active?"Очікування запитання":pressedFor?"Ти натиснула кнопку!":taken?"Першим натиснув інший гравець":"Можна натискати!";if(taken&&event.player===idx)$("#status").textContent="Ти натиснула першою!";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function readBuzz(){try{return JSON.parse(localStorage.getItem(BUZZ))}catch{return null}}
$("#player").onchange=()=>{localStorage.setItem(SELECT,$("#player").value);pressedFor="";render()};
$("#buzz").onclick=()=>{if($("#buzz").disabled||!data)return;const key=data.round+"|"+data.question.category+"|"+data.question.points+"|"+data.question.text;pressedFor=key;if(!readBuzz()||readBuzz().key!==key)localStorage.setItem(BUZZ,JSON.stringify({key,player:Number($("#player").value),name:data.players[Number($("#player").value)]?.name,time:Date.now()}));render()};
window.addEventListener("storage",e=>{if(e.key===STATE||e.key===BUZZ)render()});render();</script><script type="module" src="./online-player.js"></script></body></html>
